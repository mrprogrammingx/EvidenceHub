[project]
name = "evidencehub"
version = "0.1.0"
description = "Reference platform demonstrating Senior Data Engineer responsibilities: MySQL performance/sharding, ETL/warehouse, high-volume updating data, AWS/Redis/IAM."
requires-python = ">=3.12,<3.13"
readme = "README.md"
license = { text = "MIT" }
dependencies = [
  "pydantic>=2.9,<3",
  "pydantic-settings>=2.5,<3",
  "sqlalchemy>=2.0,<3",
  "pymysql>=1.1,<2",
  "alembic>=1.13,<2",
]

[project.optional-dependencies]
api = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
]
cache = [
  "redis>=5.0,<6",
]

[dependency-groups]
dev = [
  "ruff>=0.7,<1",
  "mypy>=1.11,<2",
  "pytest>=8.3,<9",
  "pytest-cov>=5.0,<6",
  "hypothesis>=6.112,<7",
  "testcontainers[mysql]>=4.8,<5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["evidencehub"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["evidencehub", "tests", "bench", "db"]

[tool.ruff.lint]
select = [
  "E", "F", "W",   # pycodestyle / pyflakes
  "I",             # isort
  "UP",            # pyupgrade
  "B",             # bugbear
  "C4",            # comprehensions
  "SIM",           # simplify
  "RUF",           # ruff-specific
]
ignore = []

[tool.ruff.lint.isort]
known-first-party = ["evidencehub"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["evidencehub"]
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["pymysql.*", "testcontainers.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-ra --strict-markers"
testpaths = ["tests/unit"]
markers = [
  "integration: requires Docker via testcontainers (tests/integration)",
  "chaos: destructive/failure-injection tests (tests/chaos)",
]

[tool.coverage.run]
source = ["evidencehub"]
branch = true

[tool.coverage.report]
fail_under = 85
show_missing = true
